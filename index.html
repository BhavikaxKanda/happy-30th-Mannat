<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 30th Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #fbf8f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card-container {
      perspective: 1000px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      width: 320px;
      height: 460px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      border-radius: 18px;
    }
    .card.flipped {
      transform: rotateY(180deg);
    }
    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 18px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #eee;
    }
    .front {
      background: #ffffff;
      color: #2c3e50;
      text-align: center;
    }
    .front .badge {
      font-size: 56px;
      margin-top: 10px;
    }
    .front h1 {
      font-size: 24px;
      font-weight: 700;
      margin-top: 15px;
      color: #2c3e50;
    }
    .front p {
      font-size: 17px;
      color: #7f8c8d;
      font-style: italic;
      margin-top: 15px;
    }
    .tap-hint {
      font-size: 13px;
      color: #e27d60;
      font-weight: 600;
      letter-spacing: 0.5px;
      animation: pulse 1.5s infinite;
    }
    .back {
      background: #fffafa;
      color: #2c3e50;
      transform: rotateY(180deg);
      text-align: center;
      border: 2px solid #ffccd5;
    }
    .back .punchline {
      font-size: 22px;
      font-weight: 800;
      color: #c94a64;
      line-height: 1.3;
      margin-top: 10px;
    }
    .back .message {
      font-size: 15px;
      line-height: 1.6;
      color: #444;
      margin: 15px 0;
    }
    .back .note {
      font-size: 13px;
      font-weight: 600;
      color: #c94a64;
      background: #ffeef0;
      padding: 12px;
      border-radius: 12px;
      line-height: 1.4;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.97); }
    }
  </style>
</head>
<body>

  <div class="card-container" onclick="this.querySelector('.card').classList.toggle('flipped')">
    <div class="card">
      <!-- Front of the Card -->
      <div class="face front">
        <div class="badge">👵</div>
        <div>
          <h1>Happy birthday, Grandma!</h1>
          <p>"It's better to be over the hill..."</p>
        </div>
        <div class="tap-hint">👉 TAP TO FLIP</div>
      </div>

      <!-- Inside / Back of the Card -->
      <div class="face back">
        <div class="punchline">"...than buried under it!"</div>
        <div class="message">
          Welcome to the 30 club, Mannat! 🎉<br/>
          (Chandler was right, Rachel had it coming.)
        </div>
        <div class="note">
          🎂 There is a special delivery waiting for you with the 24/7 concierge at 70 Greene!
        </div>
      </div>
    </div>
  </div>

</body>
</html>
